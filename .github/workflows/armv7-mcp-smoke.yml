name: ARMv7 offline MCP bundle smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: armv7-mcp-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout public smoke harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Register pinned ARM emulator
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf
        with:
          platforms: arm
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Recover private source and hash-pinned wheels
        id: prepare
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PART_01: ${{ secrets.MCP_ARMV7_SOURCE_B64_01 }}
          SOURCE_PART_02: ${{ secrets.MCP_ARMV7_SOURCE_B64_02 }}
          SOURCE_PART_03: ${{ secrets.MCP_ARMV7_SOURCE_B64_03 }}
          SOURCE_PART_04: ${{ secrets.MCP_ARMV7_SOURCE_B64_04 }}
          SOURCE_PART_05: ${{ secrets.MCP_ARMV7_SOURCE_B64_05 }}
          SOURCE_PART_06: ${{ secrets.MCP_ARMV7_SOURCE_B64_06 }}
          SOURCE_PART_07: ${{ secrets.MCP_ARMV7_SOURCE_B64_07 }}
          SOURCE_PART_08: ${{ secrets.MCP_ARMV7_SOURCE_B64_08 }}
        run: python3 armv7-smoke/prepare_inputs.py --root "$RUNNER_TEMP/armv7-smoke"

      - name: Run offline ARMv7 smoke in isolated container
        id: smoke
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: bash armv7-smoke/run_container.sh "$RUNNER_TEMP/armv7-smoke"

      - name: Encrypt bounded diagnostics for recovery
        id: encrypt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MCP_DIAGNOSTIC_KEY_HEX: ${{ secrets.MCP_ARMV7_DIAGNOSTIC_KEY_HEX }}
        run: python3 armv7-smoke/encrypt_report.py --root "$RUNNER_TEMP/armv7-smoke/results"

      - name: Report public status only
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
        run: |
          printf 'Input preparation: %s\nARMv7 smoke: %s\nEncrypted diagnostic recovery: %s\n' \
            "$PREPARE_OUTCOME" "$SMOKE_OUTCOME" "$ENCRYPT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREPARE_OUTCOME" != success || "$SMOKE_OUTCOME" != success || "$ENCRYPT_OUTCOME" != success ]]; then
            exit 1
          fi

      - name: Remove private runner workspace
        if: always()
        shell: bash
        run: |
          TARGET="$RUNNER_TEMP/armv7-smoke"
          case "$TARGET" in "$RUNNER_TEMP"|/|"") exit 1 ;; esac
          if [[ -L "$TARGET" ]]; then exit 1; fi
          rm -rf -- "$TARGET"
