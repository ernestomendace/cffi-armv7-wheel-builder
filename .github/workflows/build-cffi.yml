name: Build isolated CFFI ARMv7 wheel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cffi-armv7-wheel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout minimal recipe only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Register pinned ARM emulator
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf
        with:
          platforms: arm
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Fetch hash-pinned public build inputs
        shell: bash
        run: bash ./fetch-inputs.sh

      - name: Build and audit inside pinned ARMv7 manylinux image
        shell: bash
        run: bash ./run-build.sh

