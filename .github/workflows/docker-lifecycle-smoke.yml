name: Docker lifecycle x86-64 private trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-lifecycle-smoke
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ""
    steps:
      - name: Checkout public harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create private result directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/docker-trial-results"

      - name: Test fail-closed Engine preflight helpers
        shell: bash
        run: python3 -B -m unittest discover -s docker-lifecycle-smoke -p 'test_*.py'

      - name: Recover private source and hash-locked wheels
        id: prepare
        continue-on-error: true
        shell: bash
        env:
          SOURCE_PART_01: ${{ secrets.MCP_DOCKER_TRIAL_SOURCE_B64_01 }}
          SOURCE_PART_02: ${{ secrets.MCP_DOCKER_TRIAL_SOURCE_B64_02 }}
          SOURCE_PART_03: ${{ secrets.MCP_DOCKER_TRIAL_SOURCE_B64_03 }}
          SOURCE_PART_04: ${{ secrets.MCP_DOCKER_TRIAL_SOURCE_B64_04 }}
        run: |
          set -euo pipefail
          python3 -B docker-lifecycle-smoke/prepare_docker_inputs.py \
            --root "$RUNNER_TEMP/docker-trial-inputs"

      - name: Verify private entrypoint, volume initialization, diagnostics and RPC on Linux
        id: rpc_test
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DOCKER_TRIAL_SOURCE_ROOT: ${{ runner.temp }}/docker-trial-inputs/source/application
          DOCKER_TRIAL_REQUIRE_REAL_RPC_TEST: "1"
          DOCKER_TRIAL_REQUIRE_PRIVATE_ENTRYPOINT_TEST: "1"
        run: |
          set -euo pipefail
          PYTHONPATH="docker-lifecycle-smoke:$DOCKER_TRIAL_SOURCE_ROOT" \
            python3 -B -m unittest \
            test_image_permissions \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_rpc_server_stops_before_socket_close_without_thread_exception \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_actual_adapter_sentinel_command_passes_real_entrypoint_parser \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_entrypoint_argparse_failure_is_structured \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_nocopy_raw_payload_capture_is_private_bounded_and_exact \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_real_volume_initializer_transfers_ownership_without_post_transfer_path_walk \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_volume_initializer_reports_filesystem_errno_and_rolls_back_partial_transfer \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_directory_contract_failure_reports_logical_id_and_expected_observed \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_docker_log_collector_preserves_only_sanitized_filesystem_diagnostics \
            test_docker_lifecycle_runner.RunnerDiagnosticsTests.test_initializer_failure_survives_entrypoint_and_docker_log_sanitizer

      - name: Build unprivileged private test image by base digest
        id: image
        if: steps.prepare.outcome == 'success' && steps.rpc_test.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/docker-trial-inputs/source/application"
          IID="$RUNNER_TEMP/docker-trial-inputs/image.iid"
          docker build --pull --network=none --iidfile "$IID" \
            --build-arg 'PYTHON_BASE=python:3.9.25-slim-bookworm@sha256:03dee9ce00747bb5390e7b4ad00307b4dbc7790f7da77cc3581f93cfa99a6363' \
            --build-arg 'PYTHON_BASE_DIGEST=sha256:03dee9ce00747bb5390e7b4ad00307b4dbc7790f7da77cc3581f93cfa99a6363' \
            --label "codex.mcp.trial-image-run=$GITHUB_RUN_ID" \
            --tag "codex-mcp-private-trial:$GITHUB_RUN_ID" \
            --file "$ROOT/tools/Dockerfile.ex4100-trial" "$ROOT"
          test -s "$IID"

      - name: Verify built image access for application UID
        id: image_permissions
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docker-lifecycle-smoke/verify_image_permissions.py \
            --iid-file "$RUNNER_TEMP/docker-trial-inputs/image.iid"

      - name: Run phases A-C with real Docker Engine and SecureLeaseV2Store
        id: trial
        if: steps.image.outcome == 'success' && steps.image_permissions.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          MCP_DOCKER_SOURCE_ARCHIVE: ${{ runner.temp }}/docker-trial-inputs/application-source.tar.gz
          DOCKER_TRIAL_RESULTS: ${{ runner.temp }}/docker-trial-results
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          sudo -E python3 -B docker-lifecycle-smoke/docker_lifecycle_runner.py \
            --source "$RUNNER_TEMP/docker-trial-inputs/source/application" \
            --dependencies "$RUNNER_TEMP/docker-trial-inputs/dependency-bundle.tar.gz" \
            --dependency-sha256 "$(sha256sum "$RUNNER_TEMP/docker-trial-inputs/dependency-bundle.tar.gz" | cut -d' ' -f1)" \
            --image-iid "$RUNNER_TEMP/docker-trial-inputs/image.iid"

      - name: Remove only the image built for this run
        id: image_cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          IID_FILE="$RUNNER_TEMP/docker-trial-inputs/image.iid"
          REPORT="$RUNNER_TEMP/docker-trial-results/image-cleanup.json"
          mkdir -p -m 700 "$RUNNER_TEMP/docker-trial-results"
          if [[ ! -s "$IID_FILE" ]]; then
            printf '{"status":"NOT_BUILT"}\n' > "$REPORT"
            chmod 600 "$REPORT"
            exit 0
          fi
          IMAGE_ID="$(<"$IID_FILE")"
          if [[ ! "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '{"status":"FAIL","code":"IMAGE_ID_INVALID"}\n' > "$REPORT"
            chmod 600 "$REPORT"
            exit 1
          fi
          INSPECT="$(docker image inspect --format '{{.Id}} {{index .Config.Labels "codex.mcp.trial-image-run"}}' "$IMAGE_ID" 2>/dev/null || true)"
          if [[ "$INSPECT" != "$IMAGE_ID $GITHUB_RUN_ID" ]]; then
            printf '{"status":"FAIL","code":"IMAGE_IDENTITY_MISMATCH"}\n' > "$REPORT"
            chmod 600 "$REPORT"
            exit 1
          fi
          docker image rm --no-prune "$IMAGE_ID" >/dev/null
          if docker image inspect "$IMAGE_ID" >/dev/null 2>&1; then
            printf '{"status":"FAIL","code":"IMAGE_REMOVE_READBACK_FAILED"}\n' > "$REPORT"
            chmod 600 "$REPORT"
            exit 1
          fi
          printf '{"status":"PASS","resource":"run-image"}\n' > "$REPORT"
          chmod 600 "$REPORT"

      - name: Encrypt private diagnostics
        id: encrypt
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MCP_DIAGNOSTIC_KEY_HEX: ${{ secrets.MCP_DOCKER_TRIAL_DIAGNOSTIC_KEY_HEX }}
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/docker-trial-results"
          if [[ -d "$REPORT_DIR" && ! -L "$REPORT_DIR" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$REPORT_DIR"
            chmod 700 "$REPORT_DIR"
            find "$REPORT_DIR" -type d -exec chmod 700 {} +
            find "$REPORT_DIR" -type f -exec chmod 600 {} +
          fi
          python3 -B armv7-smoke/encrypt_report.py --root "$REPORT_DIR"

      - name: Publish status only
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          TRIAL_OUTCOME: ${{ steps.trial.outcome }}
          IMAGE_CLEANUP_OUTCOME: ${{ steps.image_cleanup.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          RPC_TEST_OUTCOME: ${{ steps.rpc_test.outcome }}
          IMAGE_PERMISSION_OUTCOME: ${{ steps.image_permissions.outcome }}
        run: |
          printf 'Input preparation: %s\nLinux RPC regression: %s\nImage build: %s\nImage UID access: %s\nReal Docker/CAS trial: %s\nImage cleanup: %s\nEncrypted diagnostics: %s\n' \
            "$PREPARE_OUTCOME" "$RPC_TEST_OUTCOME" "$IMAGE_OUTCOME" "$IMAGE_PERMISSION_OUTCOME" "$TRIAL_OUTCOME" "$IMAGE_CLEANUP_OUTCOME" "$ENCRYPT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREPARE_OUTCOME" != success || "$RPC_TEST_OUTCOME" != success || "$IMAGE_OUTCOME" != success || \
                "$IMAGE_PERMISSION_OUTCOME" != success || \
                "$TRIAL_OUTCOME" != success || "$IMAGE_CLEANUP_OUTCOME" != success || \
                "$ENCRYPT_OUTCOME" != success ]]; then
            exit 1
          fi

      - name: Remove private runner files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for TARGET in "$RUNNER_TEMP/docker-trial-inputs" "$RUNNER_TEMP/docker-trial-results"; do
            case "$TARGET" in
              "$RUNNER_TEMP/docker-trial-inputs"|"$RUNNER_TEMP/docker-trial-results") ;;
              *) exit 1 ;;
            esac
            [[ ! -L "$TARGET" ]] || exit 1
            if [[ -e "$TARGET" ]]; then sudo rm -rf -- "$TARGET"; fi
          done
